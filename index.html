<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLD Election 2026 | Live Tally Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <p class="breadcrumb">QLD Election 2026 | Full Results ></p>
            <h1>Queensland Results</h1>
            <p class="update-time">
                <span id="live-count">0 of 0 districts counted</span> | 
                <span id="last-updated">Loading last update...</span>
            </p>
        </header>

        <div class="bar-wrapper">
            <div class="required-text"><span id="majority-count">0</span> required for majority</div>
            <div class="majority-marker"></div>
            <div id="bar-rows-container"></div>
        </div>

        <nav class="tab-nav">
            <button class="tab-btn active" id="btn-tally">Tally Room</button>
            <button class="tab-btn" id="btn-map">Electoral Map</button>
        </nav>

        <div id="tally-view">
            <div class="filter-bar">
                <span id="filter-all" class="active" onclick="setFilter('all')">All Seats</span>
                <span id="filter-doubt" onclick="setFilter('doubt')">In Doubt</span>
                <span id="filter-changing" onclick="setFilter('changing')">Changing</span>
            </div>
            <div id="seat-list"></div>
        </div>

        <div id="map-view" style="display:none;">
            <div class="map-backdrop">
                <div class="map-legend" id="map-legend"></div>
                <div class="map-container">
                    <img src="https://i.imgur.com/uWJOqvs.png" class="map-img" alt="Queensland Electoral Map">
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
